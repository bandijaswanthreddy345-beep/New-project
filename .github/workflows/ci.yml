name: CI Hardening & Quality Gate

on:
  push:
    branches: [main, main-release]
  pull_request:
    branches: [main, main-release]

jobs:
  backend-checks:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andhra-circle-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: andhra-circle-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security Check
        env:
          JWT_SECRET: ci_test_random_super_secret_jwt_at_least_32_characters_long
          CAPTCHA_SECRET: ci_test_random_super_secret_captcha_32_chars
        run: npm run security:check

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Start local MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "6.0"

      - name: Run Backend Unit & Integration Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/ci_test_db
          JWT_SECRET: ci_test_random_super_secret_jwt_at_least_32_characters_long
          CAPTCHA_SECRET: ci_test_random_super_secret_captcha_32_chars
        run: npm test

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andhra-circle-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: andhra-circle-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend Production Bundle
        run: npm run build

